name: Deploy World News Site

on:
  workflow_dispatch:
    # ローカルスクリプトから API で呼び出すデプロイ専用ワークフロー
    # Type B/C の HTML を push 後にこのワークフローをトリガーして Pages に反映

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
