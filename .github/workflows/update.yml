name: Update World News Site

on:
  schedule:
    # 6時間ごと（UTC 0:30, 6:30, 12:30, 18:30 = JST 9:30, 15:30, 21:30, 3:30）
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:
    # 手動トリガー（ページ内「今すぐ更新」ボタン → GitHub Actions ページで「Run workflow」）

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p "db/north america"

      - name: Collect Trump Monitor data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORLDNEWS_API_KEY: ${{ secrets.WORLDNEWS_API_KEY }}
        run: python trump_monitor.py
        continue-on-error: true

      - name: Collect Theme Monitor data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORLDNEWS_API_KEY: ${{ secrets.WORLDNEWS_API_KEY }}
        run: python theme_monitor.py
        continue-on-error: true

      - name: Generate site HTML
        run: python generate_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "変更なし。スキップします。"
          else
            git commit -m "Auto update: $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M JST')"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
