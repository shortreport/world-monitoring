name: Update Trump Pages (B+C)

on:
  schedule:
    # 13:30 JST = 04:30 UTC / 22:30 JST = 13:30 UTC
    - cron: '30 4,13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-trump:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create db directory
        run: mkdir -p "db/north america"

      - name: Collect Trump Monitor data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORLDNEWS_API_KEY: ${{ secrets.WORLDNEWS_API_KEY }}
        run: python trump_monitor.py
        continue-on-error: true

      - name: Generate Type B trump.html (EN)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python make_en_trump.py
        continue-on-error: true

      - name: Generate Type C trump.html (JP)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_type_c.py --only trump --no-push
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/en/trump.html docs/jp/trump.html
          if git diff --staged --quiet; then
            echo "変更なし。スキップします。"
          else
            git commit -m "Auto update Trump: $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M JST')"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
