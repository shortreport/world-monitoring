name: Update Theme Pages (B+C)

on:
  schedule:
    # 14:00 JST = 05:00 UTC / 23:00 JST = 14:00 UTC
    - cron: '0 5,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create db directory
        run: mkdir -p "db/north america"

      - name: Collect Theme Monitor data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORLDNEWS_API_KEY: ${{ secrets.WORLDNEWS_API_KEY }}
        run: python theme_monitor.py
        continue-on-error: true

      - name: Generate Type B theme.html (EN)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python make_en_theme.py
        continue-on-error: true

      - name: Generate Type C theme.html (JP)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_type_c.py --only theme --no-push
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/en/theme.html docs/jp/theme.html docs/data/theme_latest.json
          if git diff --staged --quiet; then
            echo "変更なし。スキップします。"
          else
            git commit -m "Auto update Theme: $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M JST')"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
